name: Fix primary_q regression

on:
  push:
    branches:
      - feature/susie-ld-diagnosis-pre-cojo

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/susie-ld-diagnosis-pre-cojo
      - name: Apply fix
        run: python .github/scripts/fix_primary_q.py
      - name: Validate
        run: |
          git diff --check
          grep -Fq 'sumdf$primary_q[ii]<-p.adjust' R/CATER_MR_core_v05.R
      - name: Commit fix and remove patch machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add R/CATER_MR_core_v05.R
          git rm .github/scripts/fix_primary_q.py .github/workflows/fix-primary-q.yml
          git commit -m "Restore indexed primary q-value assignment"
          git push origin HEAD:feature/susie-ld-diagnosis-pre-cojo
