name: Address Codex review findings

on:
  push:
    branches:
      - feature/susie-ld-diagnosis-pre-cojo

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/susie-ld-diagnosis-pre-cojo
      - name: Apply review fixes
        run: python .github/scripts/address_codex_review.py
      - name: Validate patch formatting
        run: git diff --check
      - name: Commit fixes and remove patch machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add R/LD_diagnosis_precojo.R R/CATER_MR_core_v05.R tests/v06_hardening_smoke.R LD_DIAGNOSIS.md
          git rm .github/scripts/address_codex_review.py .github/workflows/address-codex-review.yml
          git commit -m "Address Codex LD diagnosis review findings"
          git push origin HEAD:feature/susie-ld-diagnosis-pre-cojo
