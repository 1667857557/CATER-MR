name: v0.8 core one-shot fix

on:
  push:
    branches: [codex/redesign-significant-trans-mr]
    paths:
      - tools/v08_patch_core.py
      - .github/workflows/v08-core-autofix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/redesign-significant-trans-mr
      - name: Patch original core implementation
        run: python tools/v08_patch_core.py
      - name: Commit direct core fixes
        run: |
          if git diff --quiet -- R/CATER_MR_core_v05.R; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add R/CATER_MR_core_v05.R
          git commit -m "fix: correct LD validation and MVMR union construction"
          git push origin HEAD:codex/redesign-significant-trans-mr
