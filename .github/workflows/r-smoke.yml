name: R smoke test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Parse main script
        run: Rscript -e "parse(file='CATER_MR.R')"
      - name: Run smoke tests
        run: Rscript tests/smoke.R
