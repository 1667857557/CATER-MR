name: R smoke test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Parse R scripts
        run: |
          Rscript -e "parse(file='CATER_MR.R')"
          Rscript -e "parse(file='SCMORE_GRN.R')"
      - name: Run core estimator smoke tests
        run: Rscript tests/smoke.R
      - name: Run scMORE-to-CATER GRN contract tests
        run: Rscript tests/scmore_contract_smoke.R
