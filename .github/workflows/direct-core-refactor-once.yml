name: Direct core refactor once

on:
  push:
    branches: [refactor/occam-direct-core-work]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/occam-direct-core-work
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
      - name: Consolidate direct functions
        run: python tools/direct_core_refactor.py
      - name: Parse direct implementation
        run: |
          Rscript -e "parse(file='CATER_MR.R')"
          Rscript -e "parse(file='R/CATER_MR_core_v05.R')"
          Rscript -e "parse(file='CATER_EQTL_INPUT.R')"
          Rscript -e "parse(file='SCMORE_GRN.R')"
      - name: Run regression tests
        run: |
          Rscript tests/smoke.R
          Rscript tests/v06_hardening_smoke.R
          Rscript tests/eqtl_table_input_smoke.R
          Rscript tests/scmore_contract_smoke.R
      - name: Commit direct implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor CATER-MR to direct Occam core"
          git push origin HEAD:refactor/occam-direct-core-work
