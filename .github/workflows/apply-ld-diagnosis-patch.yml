        exposure_corr,min_cond_F,mvmr_max_r2,mvmr_max_condition,verbose)'''
          new = '''      net<-.cater_build_mvmr(target,qtl,co$selected,sib$active,ann,eqtl_dir,qtl_n,ld_bfile,manc_cojo_bin,
        cis_window,cojo_p,cojo_wind_kb,cojo_collinear,cojo_threads,outdir,outcome,drop_palindromic,
        exposure_corr,min_cond_F,mvmr_max_r2,mvmr_max_condition,verbose,
        plink_bin=plink_bin,enable_ld_diagnosis=enable_ld_diagnosis,
        ld_diag_loglr=ld_diag_loglr,ld_diag_abs_z=ld_diag_abs_z)'''
          s = replace_once(s,old,new,'main mvmr call')

          core.write_text(s)

          test = Path('tests/v06_hardening_smoke.R')
          t = test.read_text()
          old_test = '''# 12. Backward compatibility: new options must not shift established trailing positional arguments.
formal_names <- names(formals(cater_mr))
stopifnot(identical(tail(formal_names, 4L), c("outdir","drop_palindromic","verbose","primary_policy")))'''
          new_test = '''# 12. Backward compatibility: appending new options must not shift established positional arguments.
formal_names <- names(formals(cater_mr))
legacy_tail <- c("outdir","drop_palindromic","verbose","primary_policy")
i_outdir <- match("outdir",formal_names)
stopifnot(identical(formal_names[i_outdir:(i_outdir+3L)],legacy_tail))
stopifnot(all(match(c("plink_bin","enable_ld_diagnosis","ld_diag_loglr","ld_diag_abs_z"),formal_names) > match("primary_policy",formal_names)))'''
          if old_test not in t:
              raise RuntimeError('test 12 anchor not found')
          t = t.replace(old_test,new_test,1)
          marker = 'cat("CATER-MR direct-core evidence-safety tests passed\\n")'
          if marker not in t:
              raise RuntimeError('test end marker not found')
          extra = r'''

# 14. Pre-COJO z/LD alignment handles direct swaps and strand complements without changing the LD matrix.
qz <- data.frame(snp=paste0("rs",1:5),a1=c("A","A","A","A","A"),a2=c("G","G","C","C","C"),
                 beta=rep(.2,5),se=rep(.1,5),stringsAsFactors=FALSE)
rz <- data.frame(snp=paste0("rs",1:5),ld_a1=c("A","G","T","G","A"),ld_a2=c("G","A","G","T","G"),stringsAsFactors=FALSE)
az <- .cater_align_z_to_plink(qz,rz)
stopifnot(identical(az$alignment,c("same","swap","strand_same","strand_swap","mismatch")))
stopifnot(all.equal(az$z[1:4],c(2,-2,2,-2),tolerance=1e-12),is.na(az$z[5]),!az$allele_match[5])

# 15. mapgen/SuSiE-RSS detection rule is strict: logLR > 2 and |z| > 2.
cd <- data.frame(z=c(2.1,2,5,-3),logLR=c(2.1,3,1,2.2))
stopifnot(identical(.cater_ld_outlier_index(cd,2,2),c(1L,4L)))

# 16. The public API exposes LD diagnosis controls while retaining all legacy argument positions.
stopifnot(all(c("plink_bin","enable_ld_diagnosis","ld_diag_loglr","ld_diag_abs_z") %in% names(formals(cater_mr))))
stopifnot(identical(formals(cater_mr)$enable_ld_diagnosis,TRUE))
'''
          t = t.replace(marker, extra + '\n' + marker, 1)
          test.write_text(t)

          doc = Path('LD_DIAGNOSIS.md')
          doc.write_text(r'''# Pre-COJO LD consistency diagnosis

CATER-MR now performs an LD/summary-statistic consistency gate before every Manc-COJO selection step by default.

## Method

For each candidate cis/trans locus, CATER-MR:

1. extracts the candidate variants from the configured PLINK LD reference;
2. computes a signed allele-count correlation matrix with PLINK 1.9 (`--r square`);
3. aligns eQTL z-score signs to the PLINK A1/A2 coding, including strand-complement matches;
4. estimates the SuSiE-RSS consistency parameter with `susieR::estimate_s_rss()` and obtains conditional z-score diagnostics with `susieR::kriging_rss()`;
5. removes variants satisfying the mapgen diagnostic rule `logLR > 2 & abs(z) > 2` before Manc-COJO runs.

Variants absent from the LD reference, variants with non-finite LD rows, and variants whose allele pair cannot be reconciled with the LD reference are also removed and explicitly reported. A one-variant locus cannot be conditionally diagnosed and is retained with status `NOT_DIAGNOSABLE_SINGLETON`.

This is a QC gate only. It does not use SuSiE PIP or credible sets for instrument selection; Manc-COJO remains the instrument-selection method.

## Dependencies and options

With the default `enable_ld_diagnosis=TRUE`, PLINK 1.9 and the R package `susieR` are required. `plink_bin` can be an executable name on `PATH` or an explicit path. The default detection thresholds are `ld_diag_loglr=2` and `ld_diag_abs_z=2`.

Set `enable_ld_diagnosis=FALSE` only to reproduce the legacy COJO path without this QC gate.

## Output

For target `GENE`, the full SNP-level diagnostic table is written to:

`<outdir>/cojo/GENE.ld_diagnosis.tsv`

The target summary also reports the number removed by each major reason and the maximum estimated SuSiE-RSS consistency parameter across diagnosed loci.

Reference implementation used for the diagnostic logic: xinhe-lab/mapgen, commit `393e66fe62442d2c499e4cab10a7f48309da216a`, `R/LD_diagnosis.R`.
''')
