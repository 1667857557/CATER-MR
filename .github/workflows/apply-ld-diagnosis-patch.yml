name: Apply LD diagnosis patch

on:
  push:
    branches: [feature/susie-ld-diagnosis-pre-cojo]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch direct core and tests
        run: python .github/scripts/apply_ld_diagnosis_patch.py
      - name: Commit patched implementation
        run: |
          rm .github/workflows/apply-ld-diagnosis-patch.yml
          rm .github/scripts/apply_ld_diagnosis_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add R/CATER_MR_core_v05.R tests/v06_hardening_smoke.R .github/workflows/apply-ld-diagnosis-patch.yml .github/scripts/apply_ld_diagnosis_patch.py
          git commit -m "feat: diagnose LD consistency before COJO"
          git push
