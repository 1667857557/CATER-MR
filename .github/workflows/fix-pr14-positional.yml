name: PR14 positional compatibility fix

on:
  push:
    branches: [codex/redesign-significant-trans-mr]
    paths:
      - tools/fix_pr14_positional_compat.py
      - tools/fix_pr14_test_escape.py
      - .github/workflows/fix-pr14-positional.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/redesign-significant-trans-mr
      - uses: r-lib/actions/setup-r@v2
      - name: Apply fix
        run: |
          python tools/fix_pr14_positional_compat.py
          python tools/fix_pr14_test_escape.py
      - name: Parse and test
        run: |
          Rscript -e 'parse("R/CATER_MR_core.R"); parse("tests/core_hardening_smoke.R"); parse("tests/documentation_cleanup_smoke.R"); parse("tests/positional_compat_smoke.R")'
          Rscript tests/core_hardening_smoke.R
          Rscript tests/documentation_cleanup_smoke.R
          Rscript tests/positional_compat_smoke.R
      - name: Commit fix
        run: |
          git restore .github/workflows/r-smoke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve deprecated positional argument slots"
          git push origin HEAD:codex/redesign-significant-trans-mr
