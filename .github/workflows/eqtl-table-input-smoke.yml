name: Combined eQTL table input smoke test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  eqtl-table-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Parse input adapter
        run: Rscript -e "parse(file='CATER_EQTL_INPUT.R')"
      - name: Run merged-table equivalence tests
        run: Rscript tests/eqtl_table_input_smoke.R
