name: CATER-MR v0.8 cleanup

on:
  push:
    branches: [codex/redesign-significant-trans-mr]
    paths:
      - tools/cleanup_v08.py
      - tools/fix_cleanup_ld.py
      - .github/workflows/cleanup-v08.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/redesign-significant-trans-mr
      - uses: r-lib/actions/setup-r@v2
      - name: Apply cleanup
        run: |
          python tools/cleanup_v08.py
          python tools/fix_cleanup_ld.py
      - name: Parse and test cleanup
        run: |
          Rscript -e 'parse("CATER_MR.R"); parse("R/CATER_MR_core.R"); parse("tests/smoke.R"); parse("tests/core_hardening_smoke.R"); parse("tests/v08_significant_trans_smoke.R")'
          Rscript -e 'source("CATER_MR.R"); stopifnot(exists(".cater_plink_ld", mode="function"), exists(".cater_read_plink_bim", mode="function"), !exists(".cater_read_manc_ldr", mode="function"))'
          Rscript tests/smoke.R
          Rscript tests/core_hardening_smoke.R
          Rscript tests/v08_significant_trans_smoke.R
      - name: Commit cleanup
        run: |
          # r-smoke.yml is validated locally here and updated separately via the
          # GitHub API because Actions tokens cannot push workflow-file edits.
          git restore .github/workflows/r-smoke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove obsolete COJO and LD-diagnosis code"
          git push origin HEAD:codex/redesign-significant-trans-mr
